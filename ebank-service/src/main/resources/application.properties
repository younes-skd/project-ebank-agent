spring.application.name=ebank-service
server.address=127.0.0.1
server.port=8082
management.endpoints.web.exposure.include=health,info
spring.datasource.url=jdbc:h2:mem:ebank-service;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
spring.ai.mcp.server.name=ebank-service
spring.ai.mcp.server.protocol=STREAMABLE
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000
resilience4j.circuitbreaker.instances.customer.sliding-window-size=4
resilience4j.circuitbreaker.instances.customer.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.customer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customer.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.customer.timeout-duration=3s
