spring.application.name=chatbot-service
server.address=127.0.0.1
server.port=8084
management.endpoints.web.exposure.include=health,info
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
spring.ai.openai.api-key=${OPENAI_API_KEY:local-test-key}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.mcp.client.name=ebank-agent
spring.ai.mcp.client.streamable-http.connections.customers.url=${CUSTOMER_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.bank.url=${BANK_MCP_URL:http://localhost:8082}
spring.ai.mcp.client.request-timeout=15s
bots.telegram.token=${TELEGRAM_BOT_TOKEN:}
bots.telegram.allowed-chat-id=${TELEGRAM_ALLOWED_CHAT_ID:}
bots.discord.token=${DISCORD_BOT_TOKEN:}
bots.discord.allowed-user-id=${DISCORD_ALLOWED_USER_ID:}

spring.ai.model.chat=${AI_PROVIDER:ollama}
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.num-ctx=8192
